name: Build x86 firmware

on:
  push:
    branches:
      - upgrade-openwrt-25.12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: OpenWrt x86_64 generic
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev

      - name: Prepare feeds and x86_64 configuration
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=104
          EOF
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: make -j"$(nproc)" BUILD_LOG=1

      - name: Upload x86 firmware images
        uses: actions/upload-artifact@v4
        with:
          name: q-wrt-x86_64-${{ github.run_number }}
          path: bin/targets/x86/64/**
          if-no-files-found: error
          retention-days: 14
