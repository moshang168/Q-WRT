name: Build NanoPi R2S firmware

on:
  push:
    branches:
      - upgrade-openwrt-25.12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: FriendlyElec NanoPi R2S (RK3328)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev

      - name: Prepare feeds and NanoPi R2S configuration
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r2s=y
          EOF
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: make -j"$(nproc)" BUILD_LOG=1

      - name: Upload NanoPi R2S firmware images
        uses: actions/upload-artifact@v4
        with:
          name: q-wrt-nanopi-r2s-${{ github.run_number }}
          path: bin/targets/rockchip/armv8/**
          if-no-files-found: error
          retention-days: 14
