name: Build NanoPi R2S firmware

on:
  push:
    branches:
      - upgrade-openwrt-25.12
  workflow_dispatch:

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    name: FriendlyElec NanoPi R2S (RK3328)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pyelftools python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: q-wrt-dl-r2s-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}

      - name: Prepare feeds and NanoPi R2S configuration
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r2s=y
          CONFIG_CCACHE=y
          EOF
          make defconfig
          ccache --max-size "$CCACHE_MAXSIZE"

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: q-wrt-ccache-r2s-${{ runner.os }}-${{ hashFiles('.config') }}
          restore-keys: |
            q-wrt-ccache-r2s-${{ runner.os }}-

      - name: Cache the NanoPi R2S prebuilt toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: staging_dir/toolchain-*
          key: q-wrt-toolchain-r2s-${{ runner.os }}-${{ hashFiles('.config', 'toolchain/**', 'include/**', 'rules.mk', 'target/linux/rockchip/**', 'scripts/**') }}

      - name: Build toolchain on cache miss
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: make -j"$(nproc)" toolchain/install BUILD_LOG=1

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: make -j"$(nproc)" BUILD_LOG=1

      - name: Upload NanoPi R2S firmware images
        uses: actions/upload-artifact@v6
        with:
          name: q-wrt-nanopi-r2s-${{ github.run_number }}
          path: bin/targets/rockchip/armv8/**
          if-no-files-found: error
          retention-days: 14


  publish-release:
    name: Publish release when both device builds succeed
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade-openwrt-25.12'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: q-wrt-release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release helper
        uses: actions/checkout@v5

      - name: Wait for x86 build
        uses: ./.github/actions/publish-firmware-release
        with:
          target: r2s
          current-artifact-prefix: q-wrt-nanopi-r2s
          peer-artifact-prefix: q-wrt-x86_64
          peer-workflow: build-x86.yml
          peer-job-name: OpenWrt x86_64 generic
